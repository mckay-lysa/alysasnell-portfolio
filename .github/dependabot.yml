# Dependabot keeps our dependencies patched without anyone having to remember to.
#
# Two things happen, and they're configured in different places:
#
#   1. SECURITY updates — Dependabot opens a PR when one of our dependencies has
#      a known vulnerability. These are enabled in the repo's web UI, NOT here:
#      Settings → Advanced Security → Dependabot alerts + Dependabot security
#      updates. Both must be ON. See SETUP-CHECKLIST.md.
#
#   2. VERSION updates — routine "there's a newer version" PRs. Those are what
#      this file configures.
#
# Note: pnpm projects use "npm" as the package-ecosystem value. There is no
# separate "pnpm" ecosystem.
#
# ⚠️  DO NOT EDIT THIS FILE without McKay explicitly asking for it.
#     See CLAUDE.md → "Frozen files".

version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Denver"
    # Small repo — a handful of open PRs at a time is plenty.
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "infra"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    # Batch related updates so we get a few reviewable PRs instead of twenty.
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      build-tooling:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "typescript"
          - "tailwindcss"
          - "@tailwindcss/*"
      linting-and-formatting:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "prettier"
          - "globals"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@playwright/*"
          - "@testing-library/*"
          - "happy-dom"
      # Everything else, patch and minor only, in one PR.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Keep the GitHub Actions in .github/workflows/ up to date too — pinned action
  # versions go stale and start throwing deprecation warnings otherwise.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "infra"
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
