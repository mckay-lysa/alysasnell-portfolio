name: CI

# This workflow is the safety net that lets Alysa change the site without
# being able to break it. It runs on every pull request and on main.
#
# ⚠️  DO NOT EDIT THIS FILE without McKay explicitly asking for it.
#     See CLAUDE.md → "Frozen files".

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` are on top of the defaults (opened, synchronize,
    # reopened) so the guardrails job below re-runs when the `infra` label is
    # added after the fact. Without them, adding the label leaves the check
    # stuck on its old red result.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Read-only by default. Nothing here needs write access to the repo.
permissions:
  contents: read

# A new push to a PR cancels the in-flight run for that PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Enforces the two rules in CLAUDE.md that used to be honour-system only:
  # an infra change carries the `infra` label, and it never rides along with a
  # change to the site itself.
  #
  # This does NOT decide who approves — that is CODEOWNERS plus the branch
  # ruleset, enforced by GitHub itself and not bypassable from here. This job
  # only keeps infra PRs legible: correctly labelled, and about one thing.
  guardrails:
    name: Guardrails (frozen files)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Need both sides of the PR to diff against the merge base.
          fetch-depth: 0

      - name: Check frozen-file rules
        env:
          # Passed through env, never interpolated into the script. Label names
          # and refs are user-controlled and would otherwise be shell injection.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HAS_INFRA_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'infra') }}
        run: |
          set -euo pipefail

          # The frozen list is read from CODEOWNERS so it lives in exactly one
          # place. Every non-comment line's first field is a path pattern.
          mapfile -t PATTERNS < <(grep -vE '^[[:space:]]*(#|$)' .github/CODEOWNERS | awk '{print $1}')
          if [ ${#PATTERNS[@]} -eq 0 ]; then
            echo "::error::No patterns found in .github/CODEOWNERS — refusing to run with an empty frozen list."
            exit 1
          fi

          is_frozen() {
            local file="$1" pattern
            for pattern in "${PATTERNS[@]}"; do
              pattern="${pattern#/}"
              if [[ "$pattern" == */ ]]; then
                [[ "$file" == "$pattern"* ]] && return 0
              else
                # Unquoted on purpose: this is glob matching, so tsconfig*.json works.
                # shellcheck disable=SC2053
                [[ "$file" == $pattern ]] && return 0
              fi
            done
            return 1
          }

          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          CHANGED=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA")

          frozen=()
          site=()
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if is_frozen "$file"; then
              frozen+=("$file")
            elif [[ "$file" == src/* || "$file" == public/* ]]; then
              site+=("$file")
            fi
          done <<< "$CHANGED"

          if [ ${#frozen[@]} -eq 0 ]; then
            echo "No frozen files touched. Nothing to enforce."
            echo "✅ No frozen files touched — this PR does not need McKay." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Frozen files in this PR:"
          printf '  %s\n' "${frozen[@]}"

          failed=0

          # Rule 1 — CLAUDE.md: "Never bundle an infra change with a content or
          # design change." Docs are deliberately not counted as site changes;
          # CLAUDE.md also says to update docs in the same PR.
          if [ ${#site[@]} -gt 0 ]; then
            echo "::error::This PR changes frozen files AND the site itself. Split it into two PRs."
            printf '::error::  site file: %s\n' "${site[@]}"
            failed=1
          fi

          # Rule 2 — the `infra` label, so McKay can triage from his phone.
          if [ "$HAS_INFRA_LABEL" != "true" ]; then
            echo "::error::This PR changes frozen files but is not labelled 'infra'. Add the label."
            failed=1
          fi

          # Backtick in a variable: inside single quotes shellcheck reads it as
          # a command substitution that will not expand (SC2016).
          BT='`'
          {
            echo "### Frozen files touched"
            printf -- "- ${BT}%s${BT}\n" "${frozen[@]}"
            echo
            if [ "$failed" -eq 0 ]; then
              echo "✅ Labelled \`infra\`, and no site files bundled in."
              echo
              echo "McKay's review is required before this can merge."
            else
              echo "❌ See the errors above."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$failed"

  verify:
    name: Typecheck · Lint · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        # Version comes from the "packageManager" field in package.json.
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Run end-to-end tests
        run: pnpm e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
